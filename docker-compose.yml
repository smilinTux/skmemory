# skmem-pg: the SKMemory Postgres backend (pgvector + ParadeDB BM25 + Apache AGE)
#
# This replaces the retired Qdrant (SKVector) + FalkorDB (SKGraph) stack.
# Production runs this image LOCAL per node on localhost:5432 (no replication,
# no SPOF; flat JSON files remain the source of truth, `memories` is a derived
# cache rebuilt by deploy/skmem-pg/skmem_reconcile.py).
#
# Build + run:
#   export SKMEM_PG_PASSWORD=change-me
#   docker compose up -d --build
#
# Fresh initialization runs deploy/skmem-pg/initdb/00-run-init.sh (card OPS1.3),
# which applies, in order: schema.sql (live .158 snapshot, extensions + tables +
# hybrid_search_docs/memories + all HNSW/BM25 indexes) THEN every forward
# migration in deploy/skmem-pg/migrations.txt (currently 03-ops-namespace.sql:
# the skbrain ops schema/graph/privacy-wall). A clean `docker compose up` yields
# a fully-migrated instance; no manual apply needed for a fresh DB.
#
# NOTE: if a production skmem-pg already listens on 5432 on this host, override
# the port: SKMEM_PG_PORT=15432 docker compose up -d

services:
  skmem-pg:
    build: ./deploy/skmem-pg
    image: skmem-pg:pg17-bm25-age
    container_name: skmem-pg
    command: postgres -c shared_preload_libraries=pg_search,age
    environment:
      POSTGRES_DB: ${SKMEM_PG_DB:-skmemory}
      POSTGRES_PASSWORD: ${SKMEM_PG_PASSWORD:?set SKMEM_PG_PASSWORD (no default; never commit secrets)}
    ports:
      - "127.0.0.1:${SKMEM_PG_PORT:-5432}:5432"
    volumes:
      - skmem_pg_data:/var/lib/postgresql/data
      # First-boot init: the wrapper applies schema.sql + every forward
      # migration (migrations.txt) in order. The whole deploy/skmem-pg dir is
      # mounted read-only as the wrapper's source (SKMEM_INIT_SRC).
      - ./deploy/skmem-pg/initdb/00-run-init.sh:/docker-entrypoint-initdb.d/00-run-init.sh:ro
      - ./deploy/skmem-pg:/skmem-initdb-src:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  skmem_pg_data:
    driver: local
