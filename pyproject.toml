[build-system]
requires = ["setuptools>=68.0", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "skmemory"
dynamic = ["version"]
description = "Universal AI Memory System - Polaroid snapshots for AI consciousness"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "click>=8.0,<9.0",
    "pyyaml>=6.0,<7.0",
    "mcp>=1.0,<2.0",
    "requests>=2.25",
]

[project.optional-dependencies]
seed = [
    "skseed>=0.1.0",
]
chroma = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
]
skvector = [
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
]
skgraph = [
    "falkordb>=1.0.0",
]
telegram = [
    "telethon>=1.36",
]
pqc-seal = [
    # Optional: composite ML-DSA-87 + Ed448 detached signatures for the at-rest
    # sealing seam (skmemory.sealing). NOT a hard dependency -- absent it, the
    # seam transparently falls back to the classical SHA-256 sealer.
    "sk_pgp>=0.1.0",
]
skcapstone = [
    # Optional: integration backbone (sk-alert + skscheduler). NOT a hard
    # dependency -- absent it, skmemory.integration degrades to native logging
    # + the in-process PromotionScheduler / systemd skmemory-sync@ timer.
    "skcapstone>=0.6.8",
]
all = [
    "skseed>=0.1.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "falkordb>=1.0.0",
    "telethon>=1.36",
    "skcapstone>=0.6.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pgpy>=0.5",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
skmemory = "skmemory.cli:main"
skmemory-mcp = "skmemory.mcp_server:main"
skmemory-post-install = "skmemory.post_install:main"

[project.urls]
Homepage = "https://github.com/smilinTux/skmemory"
Repository = "https://github.com/smilinTux/skmemory"
Issues = "https://github.com/smilinTux/skmemory/issues"

[tool.setuptools.packages.find]
include = ["skmemory*"]

[tool.setuptools.package-data]
skmemory = ["data/*.json", "SKILL.md", "hooks/*.sh"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archived", ".git", ".venv", "node_modules", "build", "dist"]

[tool.setuptools_scm]
# The git tag IS the version. A push to the default branch cuts the next
# patch tag (see .github/workflows/publish.yml), so every release carries a
# genuinely new version instead of rebuilding 0.11.5 forever.
#
# These repos also carry NON-semver tags (swarm-20260717, fixwave-20260723,
# memory-index-fix-20260804, nextcloud-v0.3.0). setuptools-scm defaults to the
# newest tag of ANY shape, which derived a nonsense version like
# 20260805.dev25 for skcapstone. Both settings below restrict it to release
# tags only, matching the `--match 'v[0-9]*'` the tag job uses, so the two
# cannot disagree about which tag is current.
tag_regex = "^v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*"]
