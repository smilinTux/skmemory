[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skmemory"
version = "0.9.3"
description = "Universal AI Memory System - Polaroid snapshots for AI consciousness"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "smilinTux.org", email = "hello@smilintux.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
seed = [
    "skseed>=0.1.0",
]
chroma = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.0",
]
skvector = [
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
]
skgraph = [
    "falkordb>=1.0.0",
]
telegram = [
    "telethon>=1.36",
]
all = [
    "skseed>=0.1.0",
    "chromadb>=0.5.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "falkordb>=1.0.0",
    "telethon>=1.36",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pgpy>=0.5",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
skmemory = "skmemory.cli:main"
skmemory-mcp = "skmemory.mcp_server:main"
skmemory-post-install = "skmemory.post_install:main"

[project.urls]
Homepage = "https://github.com/smilinTux/skmemory"
Repository = "https://github.com/smilinTux/skmemory"
Issues = "https://github.com/smilinTux/skmemory/issues"

[tool.setuptools.packages.find]
include = ["skmemory*"]

[tool.setuptools.package-data]
skmemory = ["data/*.json", "SKILL.md", "hooks/*.sh"]

[tool.black]
line-length = 99
target-version = ["py310"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
