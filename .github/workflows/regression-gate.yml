name: Eval Regression Gate

# Offline eval-quality regression gate.
#
# Runs the three deterministic, fully in-process eval harnesses
# (recall_benchmark, retrieval_bench, groundedness_scorer with the OFFLINE mock
# judge) via `python -m skmemory.eval.regression_gate` and compares the metrics
# against the committed eval/baseline.json. A PR that WORSENS any gated score
# (recall@k / ndcg@k / precision@k / mrr / groundedness) or leaks a private item
# (leak_count > 0) makes the gate exit non-zero and turns the PR RED.
#
# Scope / cost:
#   * This job only runs on PRs that touch the retrieval/rank/privacy/eval
#     surface (the `paths` filter below). Unrelated PRs never trigger it, so it
#     adds no cost to docs-only or unrelated changes.
#   * It is fully OFFLINE: no skmem-pg service container, no embedding endpoint,
#     no network. The harnesses stand the retrieval path up in-process (SQLite
#     keyword + deterministic hashed-vector BM25 fusion + the real audience
#     privacy filter), and groundedness uses the deterministic
#     lexical_overlap_judge, not the live sk-default judge.
#
# It also runs the sacred recall bench (skmemory/eval/sacred_bench.py): sacred
# memories must surface when the owner asks and never on any auto-inject path or
# for any declared non-owner reader. Any sacred row on any path counts toward
# leak_count, so a single leak fails the gate.
#
# This workflow is additive: it does not modify or weaken pytest.yml / ci.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - "skmemory/backends/pgvector_backend.py"
      - "skmemory/audience.py"
      - "skmemory/session_context.py"
      - "skmemory/hooks/sensitivity.py"
      - "tests/test_sacred_bench.py"
      - "skmemory/hooks/query_slice.py"
      - "skmemory/ritual.py"
      - "skmemory/store.py"
      - "skmemory/mcp_server.py"
      - "skmemory/eval/**"
      - ".github/workflows/regression-gate.yml"
  workflow_dispatch:

# Top level stays read-only. Only the `comment` job below widens to
# pull-requests: write, and it never checks out or runs PR code.
permissions:
  contents: read

jobs:
  regression-gate:
    name: eval regression gate (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (core deps only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || { pip install -e . && pip install pytest; }

      # Baseline regeneration is explicit-only (--write-baseline, run by a
      # human and committed). CI never passes it; tests/test_regression_gate.py
      # asserts no workflow does.
      - name: Run eval regression gate vs committed baseline
        run: |
          python -m skmemory.eval.regression_gate --report-md "$RUNNER_TEMP/gate-report.md"

      # Hand the table to the comment job. always() so a FAILED gate is still
      # reported; the gate step above keeps its own exit code.
      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-report
          path: ${{ runner.temp }}/gate-report.md
          if-no-files-found: ignore

      - name: Run gate unit tests
        run: |
          python -m pytest tests/test_regression_gate.py \
            --import-mode=importlib -v --tb=short

  # Posts the per-class table as ONE PR comment, updated in place on later
  # pushes (found by the hidden marker). Separate job: the only place with
  # pull-requests: write, no checkout, no PR code. Runs even when the gate
  # fails; its own failure never changes the gate job's result.
  comment:
    name: post eval table to PR
    needs: regression-gate
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download gate report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gate-report
          path: report

      - name: Create or update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: "<!-- skmemory-regression-gate -->"
        run: |
          set -euo pipefail
          test -s report/gate-report.md || { echo "no report, nothing to post"; exit 0; }
          grep -qF "$MARKER" report/gate-report.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                 --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@report/gate-report.md
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@report/gate-report.md
          fi
