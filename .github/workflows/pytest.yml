name: Tests

# Dedicated pytest workflow - green-by-construction.
#
# Invocation mirrors the repo's known-passing command (see publish.yml's
# pre-publish gate):
#
#     pytest tests/ -k "not test_sharing"
#
# Honest scoping notes:
#   * test_sharing.py exercises PGP cross-agent sharing via `pgpy`, which is
#     unstable across CPython versions (see commit 435e817 "guard pgpy import in
#     test_sharing"). It is deselected here - the same exclusion publish.yml uses
#     for its release gate - rather than relying on an import-time skip.
#
# Dependency set: `.[dev]` (pytest, pytest-cov, pgpy, black, ruff) on top of the
# core deps (pydantic, click, pyyaml, mcp). Sibling sk* packages (skseed,
# telethon, sk_pgp) are NOT installed - every
# test that needs one guards with pytest.importorskip / skipif and self-skips, so
# no GitHub-source install or allow-failure shim is required for a green run.
#
# The bootstrap test agent (SKCAPSTONE_HOME / SKCAPSTONE_AGENT in a temp dir) is
# created automatically by tests/conftest.py, so no run-from-HOME setup is needed.

on:
  push:
    branches: [main]
    paths:
      - "skmemory/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/pytest.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }}${{ matrix.engine == 'rust' && ', rust engine' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        engine: ["python"]
        include:
          # SKMEM-R-08: the whole suite again with SKMEMORY_ENGINE=rust against the
          # skmem_core wheel built from skmemory-rs main. Tests that legitimately
          # differ are listed (with a reason each) in tests/engine_allowed_diff.txt;
          # the goal is an empty list before cutover (SKMEM-R-12).
          - python-version: "3.12"
            engine: "rust"
    env:
      SKMEMORY_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the git tag, so a
          # shallow checkout would yield a placeholder like 0.1.dev1 and
          # break dependency resolution against pinned siblings.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build skmem_core from skmemory-rs main
        if: matrix.engine == 'rust'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          git clone --depth 1 https://github.com/smilinTux/skmemory-rs.git "$RUNNER_TEMP/skmemory-rs"
          git -C "$RUNNER_TEMP/skmemory-rs" log -1 --format='skmemory-rs %H'
          python -m pip install "maturin>=1.5,<2.0"
          maturin build --release --locked \
            --manifest-path "$RUNNER_TEMP/skmemory-rs/Cargo.toml" \
            -o "$RUNNER_TEMP/wheels"
          pip install "$RUNNER_TEMP"/wheels/skmem_core-*.whl
          python -c "import skmem_core; print('skmem_core', skmem_core.version())"

      - name: Run unit test suite (pgpy-sharing excluded)
        run: |
          python -m pytest tests/ \
            -k "not test_sharing" \
            -v --tb=short
