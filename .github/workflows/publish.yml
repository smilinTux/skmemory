name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Trusted Publishing (OIDC) is configured on PyPI for this project:
#   owner=smilinTux  workflow=publish.yml  environment=pypi
# No PyPI token is used in the publish path. The full test suite is intentionally
# NOT a gate here (that lives in ci.yml on PRs); a tagged release only needs to
# build cleanly and pass `twine check`, so a red/flaky unrelated test never blocks
# a release again.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Sync version from tag to package.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          npm version "$TAG_VERSION" --no-git-tag-version --allow-same-version
          echo "npm version set to $TAG_VERSION"
      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts
      - name: Build TypeScript
        run: npm run build 2>/dev/null || true
      - name: Publish to npm
        run: |
          OUTPUT=$(npm publish --access public 2>&1) && exit 0
          if echo "$OUTPUT" | grep -q "cannot publish over the previously published"; then
            echo "::warning::Version already exists on npm, skipping"
          else
            echo "$OUTPUT"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
