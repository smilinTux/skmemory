name: secret-scan

# Fleet secret-scan gate: runs the gitleaks BINARY, not gitleaks-action.
#
# The action requires a paid license for ORGANIZATION-owned repos, and smilinTux
# is an org, so it exits with "missing gitleaks license" BEFORE scanning a single
# byte. skcomms carried exactly that gate for months: permanently red, therefore
# ignored, and scanning nothing at all. gitleaks itself is MIT and free; only the
# wrapper is licensed, so calling the binary restores real scanning at no cost
# with no org secret to provision.
#
# Pinned to an exact version so a new upstream rule cannot redden CI without a
# deliberate bump. --redact keeps a genuine finding out of public CI logs.
# --exit-code 1 fails the build on a finding.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the scan walks commits, not just the tree
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # FULL history, filtered by a committed baseline of pre-existing findings.
      #
      # This repo had 1 findings already in its history when scanning was first
      # switched on, so the gate began by scanning only new commits: a full scan
      # would have been red from day one and would have been ignored, which is
      # the exact failure this gate exists to prevent.
      #
      # The baseline records those known findings by fingerprint, so the scan now
      # covers EVERY commit and fails only on something NOT already known. That
      # is strictly stronger than the incremental scan it replaces, and the
      # backlog is now visible in-repo (.gitleaks-baseline.json) where it can be worked off.
      #
      # Shrinking the baseline is the cleanup task. NEVER regenerate it to make a
      # new finding disappear: that is how a real secret gets rubber-stamped.
      - name: Scan (full history, baseline-filtered)
        run: |
          set -euo pipefail
          CFG=""
          [ -f .gitleaks.toml ] && CFG="--config .gitleaks.toml"
          gitleaks detect --source . $CFG --baseline-path .gitleaks-baseline.json \
            --redact --no-banner --exit-code 1
