name: secret-scan

# Fleet secret-scan gate: runs the gitleaks BINARY, not gitleaks-action.
#
# The action requires a paid license for ORGANIZATION-owned repos, and smilinTux
# is an org, so it exits with "missing gitleaks license" BEFORE scanning a single
# byte. skcomms carried exactly that gate for months: permanently red, therefore
# ignored, and scanning nothing at all. gitleaks itself is MIT and free; only the
# wrapper is licensed, so calling the binary restores real scanning at no cost
# with no org secret to provision.
#
# Pinned to an exact version so a new upstream rule cannot redden CI without a
# deliberate bump. --redact keeps a genuine finding out of public CI logs.
# --exit-code 1 fails the build on a finding.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the scan walks commits, not just the tree
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      # This repo has PRE-EXISTING findings in history (1 as of 2026-08-14,
      # predominantly generic-api-key hits on test vectors, fixtures and docs).
      # A full-history gate would therefore be red forever and get ignored, which
      # is the exact failure mode this rollout exists to fix. So the gate scans
      # only the commits each push/PR ADDS: new secrets are blocked from landing,
      # while the historical backlog is triaged separately rather than blocking
      # every build. Tighten this to a full scan once that backlog is cleared.
      - name: Scan (new commits)
        run: |
          set -euo pipefail
          CFG=""
          [ -f .gitleaks.toml ] && CFG="--config .gitleaks.toml"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" 2>/dev/null || true
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ -n "${{ github.event.before }}" ] \
               && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          else
            RANGE="-1"                      # first push / force push: tip only
          fi
          echo "scanning commit range: $RANGE"
          gitleaks detect --source . $CFG --redact --no-banner --exit-code 1 --log-opts="$RANGE"
